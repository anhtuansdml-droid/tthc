name: Sync TTHC DVCQG detail

on:
  push:
    paths-ignore:
      - 'data/tthc_430_2026-10-20.json'
      - 'data/tthc_detail.json'
      - 'data/dvcqg_detail_sync_report.json'
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow

      - name: Sync detail data
        run: python scripts/sync_dvcqg_detail.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tthc_430_2026-10-20.json data/tthc_detail.json data/dvcqg_detail_sync_report.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Đồng bộ dữ liệu chi tiết TTHC từ DVCQG"
            git push
          fi
