name: Cap nhat link DVCQG

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Vi tri bat dau (1-based)"
        required: true
        default: "1"
      count:
        description: "So TTHC can xu ly"
        required: true
        default: "10"
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependency
        run: python -m pip install requests

      - name: Cap nhat UUID Cổng DVC Quốc gia
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          import requests

          DATA = Path("data/tthc_430_2026-10-20.json")
          REPORT = Path("data/dvcqg_link_report.json")
          API = "https://dichvucong.gov.vn/api/v1/submitting/formality/list-all-public-formality-by-citizen"
          BASE = "https://dichvucong.gov.vn/thu-tuc-hanh-chinh/"

          start = max(1, int(os.environ.get("START", "1")))
          count = max(1, int(os.environ.get("COUNT", "10")))

          data = json.loads(DATA.read_text(encoding="utf-8"))
          end = min(len(data), start + count - 1)
          selected = data[start - 1:end]

          headers = {
              "Accept": "application/json, text/plain, */*",
              "Content-Type": "application/json; charset=UTF-8",
              "Origin": "https://dichvucong.gov.vn",
              "Referer": "https://dichvucong.gov.vn/",
              "User-Agent": "Mozilla/5.0"
          }
          session = requests.Session()

          def search(code):
              payload = {
                  "limit": 100,
                  "lastId": "",
                  "q": code,
                  "categoryId": "",
                  "departmentCode": ""
              }
              for attempt in range(3):
                  try:
                      r = session.post(API, json=payload, headers=headers, timeout=15)
                      if r.status_code in (429, 500, 502, 503, 504):
                          print(f"API {r.status_code}, thu lai {attempt + 1}/3")
                          time.sleep(2 + attempt * 2)
                          continue
                      r.raise_for_status()
                      body = r.json()
                      if body.get("code") != "OK":
                          return []
                      return body.get("data", {}).get("items", []) or []
                  except Exception as exc:
                      print(f"Loi API: {exc}")
                      if attempt < 2:
                          time.sleep(2 + attempt * 2)
              return []

          # Chi xu ly batch duoc yeu cau. Ket qua duoc ghi ngay sau tung ma.
          found = []
          missing = []

          for offset, item in enumerate(selected):
              absolute = start + offset
              code = str(item.get("ma", "")).strip()
              print(f"[{absolute}/{len(data)}] Dang tra: {code}")

              if not code:
                  missing.append({"ma": code, "reason": "missing_code"})
                  continue

              items = search(code)
              exact = []
              for x in items:
                  xcode = str(x.get("code") or x.get("codeNotation") or "").strip()
                  if xcode == code:
                      exact.append(x)

              if exact:
                  uuid = str(exact[0].get("id") or "").strip()
                  if uuid:
                      item["dvcqgId"] = uuid
                      item["url"] = BASE + uuid
                      found.append({"ma": code, "dvcqgId": uuid})
                      print(f"  OK: {uuid}")
                  else:
                      item.pop("dvcqgId", None)
                      item["url"] = ""
                      missing.append({"ma": code, "reason": "no_id"})
                      print("  KHONG CO UUID")
              else:
                  item.pop("dvcqgId", None)
                  item["url"] = ""
                  missing.append({"ma": code, "reason": "not_found"})
                  print("  KHONG TIM THAY KET QUA KHOP CHINH XAC")

              # Ghi file ngay sau moi ma de khong mat tien do neu job bi dung.
              DATA.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              time.sleep(0.2)

          # Bao cao tong hop hien tai, bao gom ca cac ma da co UUID tu cac dot truoc.
          all_found = []
          all_missing = []
          for item in data:
              code = str(item.get("ma", "")).strip()
              uuid = str(item.get("dvcqgId", "")).strip()
              if code and uuid:
                  all_found.append({"ma": code, "dvcqgId": uuid})
              elif code:
                  all_missing.append({"ma": code})

          report = {
              "total": len(data),
              "found": len(all_found),
              "missing": len(all_missing),
              "lastBatch": {"start": start, "count": len(selected), "end": end},
              "foundItems": all_found,
              "missingItems": all_missing
          }
          REPORT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"DONE batch={start}-{end} | batch_found={len(found)} | batch_missing={len(missing)} | total_found={len(all_found)}")
          PY
        env:
          START: ${{ inputs.start || '1' }}
          COUNT: ${{ inputs.count || '10' }}

      - name: Commit ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tthc_430_2026-10-20.json data/dvcqg_link_report.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Cap nhat link TTHC DVCQG theo dot"
            git push
          fi
