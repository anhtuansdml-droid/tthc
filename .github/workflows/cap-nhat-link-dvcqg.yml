name: Cap nhat link DVCQG

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Vi tri bat dau (1-based)"
        required: true
        default: "1"
      count:
        description: "So TTHC can xu ly"
        required: true
        default: "10"
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cai Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Cap nhat UUID Cổng DVC Quốc gia qua trinh duyet
        env:
          START: ${{ inputs.start || '1' }}
          COUNT: ${{ inputs.count || '10' }}
        run: |
          cat > update-links.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const DATA = 'data/tthc_430_2026-10-20.json';
          const REPORT = 'data/dvcqg_link_report.json';
          const API = 'https://dichvucong.gov.vn/api/v1/submitting/formality/list-all-public-formality-by-citizen';
          const BASE = 'https://dichvucong.gov.vn/thu-tuc-hanh-chinh/';
          const start = Math.max(1, Number(process.env.START || 1));
          const count = Math.max(1, Number(process.env.COUNT || 10));

          const data = JSON.parse(fs.readFileSync(DATA, 'utf8'));
          const end = Math.min(data.length, start + count - 1);
          const selected = data.slice(start - 1, end);

          async function main() {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
              locale: 'vi-VN'
            });
            const page = await context.newPage();

            console.log('Mo Cổng DVCQG...');
            await page.goto('https://dichvucong.gov.vn/thu-tuc-hanh-chinh', {
              waitUntil: 'domcontentloaded', timeout: 60000
            });
            console.log('Trang da mo.');

            async function search(code) {
              return await page.evaluate(async ({ API, code }) => {
                const body = {
                  limit: 100,
                  lastId: '',
                  q: code,
                  serviceGroupId: '',
                  categoryId: '',
                  departmentCode: ''
                };
                for (let i = 0; i < 3; i++) {
                  try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 30000);
                    const r = await fetch(API, {
                      method: 'POST',
                      headers: {
                        'Accept': 'application/json, text/plain, */*',
                        'Content-Type': 'application/json; charset=UTF-8'
                      },
                      body: JSON.stringify(body),
                      signal: controller.signal
                    });
                    clearTimeout(timer);
                    const text = await r.text();
                    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + text.slice(0, 300));
                    const json = JSON.parse(text);
                    if (json.code !== 'OK') return { items: [], apiCode: json.code, message: json.message || '' };
                    return { items: (json.data && json.data.items) || [], apiCode: 'OK' };
                  } catch (e) {
                    if (i === 2) return { items: [], error: String(e) };
                    await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                  }
                }
              }, { API, code });
            }

            let batchFound = 0;
            let batchMissing = 0;

            for (let i = 0; i < selected.length; i++) {
              const absolute = start + i;
              const item = selected[i];
              const code = String(item.ma || '').trim();
              console.log(`[${absolute}/${data.length}] Tra ${code}`);

              if (!code) {
                batchMissing++;
                continue;
              }

              const result = await search(code);
              const exact = (result.items || []).filter(x =>
                String(x.code || x.codeNotation || '').trim() === code
              );

              if (exact.length) {
                const uuid = String(exact[0].id || '').trim();
                const returnedCode = String(exact[0].code || exact[0].codeNotation || '').trim();
                if (uuid && returnedCode === code) {
                  item.dvcqgId = uuid;
                  item.url = BASE + encodeURIComponent(uuid);
                  batchFound++;
                  console.log(`  OK ${code} -> ${uuid}`);
                } else {
                  delete item.dvcqgId;
                  item.url = '';
                  batchMissing++;
                  console.log('  KHONG HOP UUID');
                }
              } else {
                delete item.dvcqgId;
                item.url = '';
                batchMissing++;
                console.log(`  KHONG TIM THAY | ${result.error || result.apiCode || ''}`);
              }

              fs.writeFileSync(DATA, JSON.stringify(data, null, 2) + '\n', 'utf8');
            }

            const foundItems = data.filter(x => x.ma && x.dvcqgId).map(x => ({ ma: x.ma, dvcqgId: x.dvcqgId }));
            const missingItems = data.filter(x => x.ma && !x.dvcqgId).map(x => ({ ma: x.ma }));
            fs.writeFileSync(REPORT, JSON.stringify({
              total: data.length,
              found: foundItems.length,
              missing: missingItems.length,
              lastBatch: { start, count: selected.length, end },
              foundItems,
              missingItems
            }, null, 2) + '\n', 'utf8');

            console.log(`DONE ${start}-${end} | batch_found=${batchFound} | batch_missing=${batchMissing} | total_found=${foundItems.length}/${data.length}`);
            await browser.close();
          }

          main().catch(err => { console.error(err); process.exit(1); });
          NODE
          node update-links.cjs

      - name: Commit ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tthc_430_2026-10-20.json data/dvcqg_link_report.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Cap nhat link TTHC DVCQG theo dot"
            git push
          fi
