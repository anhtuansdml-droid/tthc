name: Cap nhat link DVCQG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start:
        description: "Vi tri bat dau (1-based)"
        required: true
        default: "1"
      count:
        description: "So TTHC can xu ly"
        required: true
        default: "430"
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: write

jobs:
  update-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai Python va thu vien
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow

      - name: Tai dataset TTHC co UUID DVCQG
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            "https://huggingface.co/datasets/tmquan/dichvucong-gov-vn/resolve/main/procedures-00000-of-00001.parquet?download=true" \
            -o .cache/procedures.parquet
          ls -lh .cache/procedures.parquet

      - name: Doi chieu UUID DVCQG an toan theo ma va ten
        env:
          START: ${{ inputs.start || '1' }}
          COUNT: ${{ inputs.count || '430' }}
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          import pandas as pd

          DATA = 'data/tthc_430_2026-10-20.json'
          REPORT = 'data/dvcqg_link_report.json'
          PARQUET = '.cache/procedures.parquet'
          START = max(1, int(os.environ.get('START', '1')))
          COUNT = max(1, int(os.environ.get('COUNT', '430')))

          def norm_text(s):
              s = '' if s is None else str(s)
              s = unicodedata.normalize('NFD', s)
              s = ''.join(c for c in s if unicodedata.category(c) != 'Mn')
              s = s.lower().replace('đ', 'd')
              s = re.sub(r'[^a-z0-9]+', ' ', s)
              return re.sub(r'\s+', ' ', s).strip()

          def norm_code(s):
              """Chi bo sung so 0 o CUOI ma, khong xoa so 0 o DAU segment.
              Vi du 2.00072 == 2.000720, nhung 1.01304 != 1.001304.
              """
              s = '' if s is None else str(s).strip()
              parts = s.split('.')
              if len(parts) >= 2 and all(p.isdigit() for p in parts):
                  parts = [parts[0]] + [p.rstrip('0') or '0' for p in parts[1:]]
                  return '.'.join(parts)
              return re.sub(r'\s+', '', s).lower()

          with open(DATA, 'r', encoding='utf-8') as f:
              data = json.load(f)

          end = min(len(data), START + COUNT - 1)
          selected = data[START - 1:end]

          df = pd.read_parquet(PARQUET, columns=['formality_id','code','source_url','procedure_name','is_ward'])
          for col in ['code','formality_id','source_url','procedure_name']:
              df[col] = df[col].fillna('').astype(str).str.strip()
          df = df[df['formality_id'] != ''].copy()
          df['_ward'] = df['is_ward'].fillna(False).astype(bool)
          df['_ncode'] = df['code'].map(norm_code)
          df['_nname'] = df['procedure_name'].map(norm_text)
          df = df.sort_values(['_ward'], ascending=[False])

          # Chi dung ma sau khi chuan hoa an toan; khong dung kieu 1.01304 -> 1.001304.
          by_code = {}
          for _, r in df.iterrows():
              code = r['_ncode']
              if code and code not in by_code:
                  by_code[code] = r

          # Ten chi dung khi duy nhat trong dataset.
          by_name = {}
          for _, r in df.iterrows():
              name = r['_nname']
              if name:
                  by_name.setdefault(name, []).append(r)

          def make_url(r):
              fid = str(r['formality_id']).strip()
              return str(r['source_url']).strip() or f'https://dichvucong.gov.vn/tim-kiem-thu-tuc-hanh-chinh?formalityId={fid}'

          found_batch = 0
          methods = {'ma': 0, 'ten': 0}
          used_ids = set()
          # Bao gom cac UUID dang co ngoai batch de khong gan trung cho TTHC khac.
          for item in data:
              if str(item.get('dvcqgId','')).strip():
                  used_ids.add(str(item['dvcqgId']).strip())
          for item in selected:
              used_ids.discard(str(item.get('dvcqgId','')).strip())

          for idx, item in enumerate(selected, start=START):
              code = str(item.get('ma','')).strip()
              name = str(item.get('ten','')).strip()
              ncode = norm_code(code)
              nname = norm_text(name)
              row = by_code.get(ncode)
              method = 'ma'

              # Neu ma khong co, chi dung ten khi co DUY NHAT mot ban ghi.
              if row is None and nname:
                  candidates = by_name.get(nname, [])
                  if len(candidates) == 1:
                      row = candidates[0]
                      method = 'ten'

              if row is not None and str(row['formality_id']).strip():
                  fid = str(row['formality_id']).strip()
                  # Mot UUID khong duoc gan cho 2 TTHC khac nhau.
                  if fid in used_ids:
                      row = None
                      print(f'[{idx}/{len(data)}] BO QUA TRUNG UUID {code} | {fid}')
                  else:
                      item['dvcqgId'] = fid
                      item['url'] = make_url(row)
                      used_ids.add(fid)
                      found_batch += 1
                      methods[method] += 1
                      print(f'[{idx}/{len(data)}] OK {code} | {method} | {fid} | {row["code"]}')

              if row is None:
                  item.pop('dvcqgId', None)
                  item['url'] = ''
                  print(f'[{idx}/{len(data)}] KHONG GAN {code} | {name}')

          with open(DATA, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')

          found_all = [{'ma': x.get('ma'), 'ten': x.get('ten'), 'dvcqgId': x.get('dvcqgId'), 'url': x.get('url','')} for x in data if str(x.get('dvcqgId','')).strip()]
          missing_all = [{'ma': x.get('ma'), 'ten': x.get('ten')} for x in data if not str(x.get('dvcqgId','')).strip()]
          duplicate_ids = {}
          for x in found_all:
              duplicate_ids.setdefault(x['dvcqgId'], []).append(x['ma'])
          duplicate_ids = {k:v for k,v in duplicate_ids.items() if len(v) > 1}

          report = {
              'total': len(data),
              'found': len(found_all),
              'missing': len(missing_all),
              'duplicateUuidCount': len(duplicate_ids),
              'lastBatch': {'start': START, 'count': len(selected), 'end': end, 'foundBatch': found_batch, 'methods': methods},
              'source': 'tmquan/dichvucong-gov-vn procedures parquet; exact normalized code -> unique exact name; no fuzzy matching',
              'foundItems': found_all,
              'missingItems': missing_all,
              'duplicateUuidItems': duplicate_ids
          }
          with open(REPORT, 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print(f'DONE {START}-{end} | batch_found={found_batch} | ma={methods["ma"]} | ten={methods["ten"]} | all_found={len(found_all)} | missing={len(missing_all)} | duplicate_uuid={len(duplicate_ids)}')
          PY

      - name: Commit ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tthc_430_2026-10-20.json data/dvcqg_link_report.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Sua doi chieu UUID DVCQG an toan"
            git push
          fi
