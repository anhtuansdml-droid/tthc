name: Cap nhat link DVCQG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start:
        description: "Vi tri bat dau (1-based)"
        required: true
        default: "1"
      count:
        description: "So TTHC can xu ly"
        required: true
        default: "430"
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: write

jobs:
  update-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai Python va thu vien
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow

      - name: Tai dataset TTHC co UUID DVCQG
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            "https://huggingface.co/datasets/tmquan/dichvucong-gov-vn/resolve/main/procedures-00000-of-00001.parquet?download=true" \
            -o .cache/procedures.parquet
          ls -lh .cache/procedures.parquet

      - name: Cap nhat UUID va link DVCQG
        env:
          START: ${{ inputs.start || '1' }}
          COUNT: ${{ inputs.count || '430' }}
        run: |
          python - <<'PY'
          import json, os
          import pandas as pd

          DATA = 'data/tthc_430_2026-10-20.json'
          REPORT = 'data/dvcqg_link_report.json'
          PARQUET = '.cache/procedures.parquet'
          START = max(1, int(os.environ.get('START', '1')))
          COUNT = max(1, int(os.environ.get('COUNT', '430')))

          with open(DATA, 'r', encoding='utf-8') as f:
              data = json.load(f)

          end = min(len(data), START + COUNT - 1)
          selected = data[START - 1:end]
          codes = {str(x.get('ma','')).strip() for x in selected if str(x.get('ma','')).strip()}

          df = pd.read_parquet(PARQUET, columns=['formality_id','code','source_url','procedure_name','is_ward'])
          df['code'] = df['code'].fillna('').astype(str).str.strip()
          df['formality_id'] = df['formality_id'].fillna('').astype(str).str.strip()
          df['source_url'] = df['source_url'].fillna('').astype(str).str.strip()
          df = df[df['code'].isin(codes)].copy()

          # Uu tien ban ghi cap xa neu cung ma co nhieu ban ghi.
          df['_ward'] = df['is_ward'].fillna(False).astype(bool)
          df = df.sort_values(['code', '_ward'], ascending=[True, False]).drop_duplicates('code', keep='first')
          lookup = {r['code']: r for _, r in df.iterrows()}

          found_batch = 0
          for idx, item in enumerate(selected, start=START):
              code = str(item.get('ma','')).strip()
              row = lookup.get(code)
              if row is not None and row['formality_id']:
                  fid = str(row['formality_id']).strip()
                  item['dvcqgId'] = fid
                  # Link hien tai cua dataset DVCQG; khong phu thuoc viec runner co truy cap duoc dichvucong.gov.vn hay khong.
                  item['url'] = str(row['source_url']).strip() or f'https://dichvucong.gov.vn/tim-kiem-thu-tuc-hanh-chinh?formalityId={fid}'
                  found_batch += 1
                  print(f'[{idx}/{len(data)}] OK {code} -> {fid}')
              else:
                  item.pop('dvcqgId', None)
                  item['url'] = ''
                  print(f'[{idx}/{len(data)}] KHONG TIM THAY {code}')

          with open(DATA, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')

          found_all = [{'ma': x.get('ma'), 'dvcqgId': x.get('dvcqgId'), 'url': x.get('url','')} for x in data if str(x.get('dvcqgId','')).strip()]
          missing_all = [{'ma': x.get('ma')} for x in data if not str(x.get('dvcqgId','')).strip()]
          report = {
              'total': len(data),
              'found': len(found_all),
              'missing': len(missing_all),
              'lastBatch': {'start': START, 'count': len(selected), 'end': end, 'foundBatch': found_batch},
              'source': 'tmquan/dichvucong-gov-vn procedures parquet',
              'foundItems': found_all,
              'missingItems': missing_all
          }
          with open(REPORT, 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print(f'DONE {START}-{end} | batch_found={found_batch} | all_found={len(found_all)} | missing={len(missing_all)}')
          PY

      - name: Commit ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tthc_430_2026-10-20.json data/dvcqg_link_report.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Cap nhat UUID va link TTHC DVCQG"
            git push
          fi
