name: Cap nhat link DVCQG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start:
        description: "Vi tri bat dau (1-based)"
        required: true
        default: "1"
      count:
        description: "So TTHC can xu ly"
        required: true
        default: "10"
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: write

jobs:
  update-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cai Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Cap nhat UUID Cổng DVC Quốc gia qua trinh duyet
        env:
          PYTHONUNBUFFERED: "1"
          START: ${{ inputs.start || '1' }}
          COUNT: ${{ inputs.count || '10' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const DATA = 'data/tthc_430_2026-10-20.json';
          const REPORT = 'data/dvcqg_link_report.json';
          const BASE = 'https://dichvucong.gov.vn/thu-tuc-hanh-chinh/';
          const start = Math.max(1, Number(process.env.START || 1));
          const count = Math.max(1, Number(process.env.COUNT || 10));
          const data = JSON.parse(fs.readFileSync(DATA, 'utf8'));
          const end = Math.min(data.length, start + count - 1);
          const selected = data.slice(start - 1, end);

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({userAgent:'Mozilla/5.0'});
            await page.goto('https://dichvucong.gov.vn/', {waitUntil:'domcontentloaded', timeout:60000});
            console.log('DVCQG page:', await page.title());

            for (let i=0; i<selected.length; i++) {
              const item = selected[i];
              const code = String(item.ma || '').trim();
              console.log(`[${start+i}/${data.length}] Dang tra: ${code}`);
              let found = null;
              try {
                const result = await page.evaluate(async (code) => {
                  const r = await fetch('/api/v1/submitting/formality/list-all-public-formality-by-citizen', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({limit:100,lastId:'',q:code,categoryId:'',departmentCode:''})
                  });
                  return {status:r.status, body:await r.text()};
                }, code);
                console.log('  API status:', result.status);
                if (result.status === 200) {
                  const body = JSON.parse(result.body);
                  const items = body?.data?.items || [];
                  found = items.find(x => String(x.code || x.codeNotation || '').trim() === code && x.id);
                }
              } catch(e) { console.log('  LOI:', e.message); }

              if (found) {
                item.dvcqgId = String(found.id).trim();
                item.url = BASE + encodeURIComponent(item.dvcqgId);
                console.log('  OK:', item.dvcqgId);
              } else {
                delete item.dvcqgId;
                item.url = '';
                console.log('  KHONG TIM THAY KHOP CHINH XAC');
              }
              fs.writeFileSync(DATA, JSON.stringify(data,null,2)+'\n');
            }

            const foundAll = data.filter(x => String(x.dvcqgId||'').trim()).map(x => ({ma:x.ma,dvcqgId:x.dvcqgId}));
            const missingAll = data.filter(x => !String(x.dvcqgId||'').trim()).map(x => ({ma:x.ma}));
            fs.writeFileSync(REPORT, JSON.stringify({total:data.length,found:foundAll.length,missing:missingAll.length,lastBatch:{start,count:selected.length,end},foundItems:foundAll,missingItems:missingAll},null,2)+'\n');
            await browser.close();
            console.log(`DONE ${start}-${end} | found=${foundAll.length} | missing=${missingAll.length}`);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Commit ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tthc_430_2026-10-20.json data/dvcqg_link_report.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Cap nhat link TTHC DVCQG theo dot"
            git push
          fi
